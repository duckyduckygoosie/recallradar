[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recallradar-backend"
version = "0.1.0"
description = "OpenFDA research API for RecallRadar"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<3",
  "pydantic>=2.6,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
test = ["pytest>=8,<9", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
